<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM Log Viewer</title>
<style>
  :root {
    --bg: #ffffff; --panel: #f6f7f9; --border: #d8dce2; --text: #1c1e21;
    --dim: #6b7280; --accent: #2563eb; --ok: #15803d; --warn: #b45309;
    --err: #b91c1c; --code-bg: #f2f3f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d; --panel: #1e2127; --border: #2f343d; --text: #e4e6eb;
      --dim: #9aa1ac; --accent: #60a5fa; --ok: #4ade80; --warn: #fbbf24;
      --err: #f87171; --code-bg: #12141a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, Segoe UI, Roboto, sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 10px 14px; border-bottom: 1px solid var(--border);
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  }
  h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 600; }
  input[type=search], select {
    padding: 5px 8px; border: 1px solid var(--border); border-radius: 5px;
    background: var(--bg); color: var(--text); font-size: 13px;
  }
  input[type=search] { min-width: 200px; }
  .stats { display: flex; gap: 16px; margin-left: auto; flex-wrap: wrap; }
  .stat { font-size: 12px; color: var(--dim); white-space: nowrap; }
  .stat b { color: var(--text); font-size: 14px; font-weight: 600; }

  main { flex: 1; display: flex; min-height: 0; }
  #list {
    width: 44%; min-width: 300px; overflow-y: auto;
    border-right: 1px solid var(--border);
  }
  #detail { flex: 1; overflow-y: auto; padding: 14px; }

  .row {
    padding: 8px 12px; border-bottom: 1px solid var(--border); cursor: pointer;
    display: flex; gap: 8px; align-items: baseline;
  }
  .row:hover { background: var(--panel); }
  .row.sel { background: var(--panel); box-shadow: inset 3px 0 0 var(--accent); }
  .row.bad .name { color: var(--err); }
  .addr {
    font-family: ui-monospace, Consolas, monospace; font-size: 12px;
    color: var(--dim); flex-shrink: 0;
  }
  .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis;
          white-space: nowrap; flex: 1; }
  .meta { font-size: 11px; color: var(--dim); flex-shrink: 0; }
  .badges { display: flex; gap: 3px; flex-shrink: 0; }
  .b {
    font-size: 9px; font-weight: 700; width: 15px; height: 15px;
    display: grid; place-items: center; border-radius: 3px;
    background: var(--border); color: var(--dim);
  }
  .b.on { background: var(--ok); color: var(--bg); }

  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .5px;
       color: var(--dim); margin: 18px 0 6px; font-weight: 600; }
  h2:first-child { margin-top: 0; }
  pre {
    background: var(--code-bg); border: 1px solid var(--border);
    border-radius: 6px; padding: 10px; overflow-x: auto; margin: 0;
    font-family: ui-monospace, Consolas, monospace; font-size: 12px;
    white-space: pre-wrap; word-break: break-word;
  }
  .kv { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-bottom: 4px; }
  .kv div { font-size: 12px; color: var(--dim); }
  .kv b { color: var(--text); font-weight: 600; }
  .sec { color: var(--accent); font-weight: 600; }
  .empty { padding: 40px; text-align: center; color: var(--dim); }
  .drop { outline: 2px dashed var(--accent); outline-offset: -8px; }
  code.pill {
    background: var(--code-bg); border: 1px solid var(--border);
    border-radius: 4px; padding: 1px 5px; font-size: 12px;
  }
</style>
</head>
<body>
<header>
  <h1>LLM Log</h1>
  <input type="file" id="file" accept=".jsonl,.json,.log">
  <input type="search" id="q" placeholder="filter: address, name, category, text…">
  <select id="sort">
    <option value="order">order logged</option>
    <option value="slow">slowest first</option>
    <option value="tokens">most prompt tokens</option>
    <option value="conf">lowest confidence</option>
    <option value="bad">failures first</option>
  </select>
  <div class="stats" id="stats"></div>
</header>
<main>
  <div id="list"><div class="empty">Drop <code class="pill">llm_log.jsonl</code> here,
    or use the file picker above.</div></div>
  <div id="detail"><div class="empty">Select an entry.</div></div>
</main>

<script>
let rows = [], view = [], sel = -1;

// mirror of extract_json_object() in hybrid_re.py
function extractJson(t) {
  if (!t) return null;
  const s = t.indexOf('{'), e = t.lastIndexOf('}');
  if (s < 0 || e < 0 || e <= s) return null;
  const blob = t.slice(s, e + 1);
  try { return JSON.parse(blob); }
  catch (_) {
    try { return JSON.parse(blob.replace(/,(\s*[}\]])/g, '$1')); }
    catch (_) { return null; }
  }
}

function parse(text) {
  rows = text.split('\n').filter(l => l.trim()).map((line, i) => {
    let d; try { d = JSON.parse(line); } catch (_) { return null; }
    const parsed = extractJson(d.response);
    const p = d.prompt || '';
    return {
      i, ...d, parsed,
      ok: !!(parsed && parsed.new_name),
      name: parsed && parsed.new_name || '(no name returned)',
      cat: parsed && parsed.category || '',
      conf: parsed && typeof parsed.confidence === 'number' ? parsed.confidence : null,
      has: {
        S: p.includes('Referenced strings:'),
        A: p.includes('API calls:'),
        C: p.includes('Calls (already understood):'),
        P: p.includes('Called by'),
      },
    };
  }).filter(Boolean);
  render();
}

function stats() {
  const n = rows.length;
  if (!n) return '';
  const sum = (f) => rows.reduce((a, r) => a + (f(r) || 0), 0);
  const bad = rows.filter(r => !r.ok).length;
  const confs = rows.filter(r => r.conf !== null);
  const avgConf = confs.length ? (sum(r => r.conf) / confs.length).toFixed(2) : '–';
  return `
    <div class="stat"><b>${n}</b> calls</div>
    <div class="stat"><b>${(sum(r => r.elapsed) / n).toFixed(2)}s</b> avg</div>
    <div class="stat"><b>${Math.round(sum(r => r.prompt_tokens) / n)}</b> prompt tok</div>
    <div class="stat"><b>${Math.round(sum(r => r.completion_tokens) / n)}</b> out tok</div>
    <div class="stat"><b>${avgConf}</b> avg conf</div>
    <div class="stat" style="color:${bad ? 'var(--err)' : 'var(--dim)'}"><b>${bad}</b> failed</div>`;
}

function render() {
  const q = document.getElementById('q').value.toLowerCase();
  const mode = document.getElementById('sort').value;
  view = rows.filter(r => !q ||
    (r.address || '').toLowerCase().includes(q) ||
    r.name.toLowerCase().includes(q) ||
    (r.cat || '').toLowerCase().includes(q) ||
    (r.prompt || '').toLowerCase().includes(q) ||
    (r.response || '').toLowerCase().includes(q));

  const cmp = {
    order: (a, b) => a.i - b.i,
    slow:  (a, b) => (b.elapsed || 0) - (a.elapsed || 0),
    tokens:(a, b) => (b.prompt_tokens || 0) - (a.prompt_tokens || 0),
    conf:  (a, b) => (a.conf ?? 9) - (b.conf ?? 9),
    bad:   (a, b) => (a.ok - b.ok) || a.i - b.i,
  }[mode];
  view.sort(cmp);

  document.getElementById('stats').innerHTML = stats();
  document.getElementById('list').innerHTML = view.length ? view.map((r, k) => `
    <div class="row ${r.ok ? '' : 'bad'} ${k === sel ? 'sel' : ''}" data-k="${k}">
      <span class="addr">${r.address || '?'}</span>
      <span class="name">${esc(r.name)}</span>
      <span class="badges">${['S','A','C','P'].map(b =>
        `<span class="b ${r.has[b] ? 'on' : ''}" title="${
          {S:'strings',A:'APIs',C:'callee summaries',P:'callers'}[b]}">${b}</span>`).join('')}</span>
      <span class="meta">${r.conf !== null ? r.conf.toFixed(2) + ' · ' : ''}${
        (r.elapsed ?? 0).toFixed(1)}s</span>
    </div>`).join('') : '<div class="empty">No matches.</div>';
}

function esc(s) {
  return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

// highlight the evidence section headers so it's obvious what landed
function fmtPrompt(p) {
  return esc(p).replace(
    /^(Function:|Called by.*:|Referenced strings:|.*API calls:|Calls \(already understood\):|Other named calls:|Notable.*constants:|Note:|Decompiled code:)/gm,
    '<span class="sec">$1</span>');
}

function show(k) {
  sel = k; render();
  const r = view[k];
  if (!r) return;
  document.getElementById('detail').innerHTML = `
    <div class="kv">
      <div>addr <b>${r.address || '?'}</b></div>
      <div>time <b>${r.time || '?'}</b></div>
      <div>took <b>${(r.elapsed ?? 0).toFixed(2)}s</b></div>
      <div>tokens <b>${r.prompt_tokens ?? '?'}</b> in / <b>${r.completion_tokens ?? '?'}</b> out</div>
      ${r.cat ? `<div>category <b>${esc(r.cat)}</b></div>` : ''}
      ${r.conf !== null ? `<div>confidence <b>${r.conf}</b></div>` : ''}
    </div>
    <h2>Parsed result</h2>
    <pre style="${r.ok ? '' : 'border-color:var(--err)'}">${
      r.parsed ? esc(JSON.stringify(r.parsed, null, 2))
               : '<span style="color:var(--err)">could not parse JSON from response</span>'}</pre>
    <h2>Raw response</h2>
    <pre>${esc(r.response || '')}</pre>
    <h2>Prompt sent (${(r.prompt || '').length} chars)</h2>
    <pre>${fmtPrompt(r.prompt || '')}</pre>`;
  document.getElementById('detail').scrollTop = 0;
}

document.getElementById('list').addEventListener('click', e => {
  const row = e.target.closest('.row');
  if (row) show(+row.dataset.k);
});
document.getElementById('q').addEventListener('input', () => { sel = -1; render(); });
document.getElementById('sort').addEventListener('change', () => { sel = -1; render(); });
document.getElementById('file').addEventListener('change', e => {
  const f = e.target.files[0];
  if (f) f.text().then(parse);
});

// drag & drop anywhere
document.addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('drop'); });
document.addEventListener('dragleave', () => document.body.classList.remove('drop'));
document.addEventListener('drop', e => {
  e.preventDefault(); document.body.classList.remove('drop');
  const f = e.dataTransfer.files[0];
  if (f) f.text().then(parse);
});

// if served over http (python -m http.server), load automatically
if (location.protocol.startsWith('http')) {
  fetch('llm_log.jsonl').then(r => r.ok ? r.text() : null).then(t => t && parse(t)).catch(() => {});
}
</script>
</body>
</html>
